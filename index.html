<style>
  :root {
    --bg: #f3f8f4; --ink: #1d2e24; --sub: #6a7d71; --card: #fff; --accent: #11803f; --accent2: #d3202c; --line: #dce9e0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121b16; --ink: #eaf3ed; --sub: #9db0a4; --card: #1b2820; --accent: #2ea560; --accent2: #ef4a55; --line: #2c3d33; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 16px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px; }
  h1 img { height: 40px; width: auto; display: block; }
  h1 .ver { font-style: normal; font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; padding: 3px 9px; }
  footer.appfoot { text-align: center; font-size: 12px; color: var(--sub); line-height: 1.7; margin: 18px 0 8px; }
  h1 small { display: block; font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: .5px; }
  main::before { content: ""; display: block; height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) 0 70%, var(--accent2) 70% 100%); margin-bottom: 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
  .stage { position: relative; aspect-ratio: 4/3; background: #000; border-radius: 12px; overflow: hidden; }
  .stage canvas { width: 100%; height: 100%; display: block; }
  .stage .guide { position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); pointer-events: none; border: 2px dashed rgba(255,255,255,.85); box-shadow: 0 0 0 999px rgba(0,0,0,.45); }
  .chips button { padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; cursor: pointer; }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  #mascots button { padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; cursor: pointer; }
  #mascots button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  #fields { margin: 10px 0 12px; }
  #fields .row { flex-wrap: nowrap; }
  #fields .row + .row { margin-top: 8px; }
  #fields label.t { min-width: 64px; }
  .stage .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: #fff; padding: 24px; font-size: 15px; line-height: 1.5; }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .thumbs div { aspect-ratio: 4/3; background: var(--line); border-radius: 6px; overflow: hidden; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row + .row { margin-top: 10px; }
  label.t { font-size: 13px; color: var(--sub); min-width: 48px; }
  .swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
  .swatch[aria-pressed="true"] { outline: 3px solid var(--accent); outline-offset: 2px; }
  input[type=text] { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 15px; }
  button.btn { flex: 1; padding: 13px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn:disabled { opacity: .5; cursor: default; }
  .result { display: none; }
  .result.on { display: block; }
  .result img { width: 100%; max-width: 300px; display: block; margin: 0 auto 12px; border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
  .result video { width: 100%; border-radius: 12px; background: #000; margin-bottom: 12px; }
  .hint { font-size: 12px; color: var(--sub); text-align: center; margin: 4px 0 0; }
  .qrbox { text-align: center; margin: 4px 0 14px; padding: 12px; border: 1px dashed var(--line); border-radius: 12px; }
  #qrImg { background: #fff; display: inline-block; padding: 6px; border-radius: 8px; min-height: 40px; }
  #qrImg svg { width: 220px; height: 220px; display: block; }
  #qrMsg { margin: 8px 0 0; font-size: 14px; font-weight: 600; }
  #qrSub { margin: 2px 0 0; font-size: 12px; color: var(--sub); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1><img id="hdrLogo" alt="혜원여자중학교 교표"><span id="hdrTitle"><small>HYEWON GIRLS' MIDDLE SCHOOL</small>혜원여중 네컷</span><em class="ver">v1.0.0</em></h1>

  <section id="boothSec">
    <div class="card">
      <div class="stage">
        <canvas id="cam" width="960" height="720"></canvas>
        <div class="guide" id="guide"></div>
        <div class="msg" id="camMsg">카메라를 켜는 중…</div>
      </div>
      <div class="thumbs" id="thumbs"><div></div><div></div><div></div><div></div></div>
    </div>

    <div class="card">
      <div class="row">
        <label class="t">테마</label>
        <div class="row" id="swatches"></div>
      </div>
      <div class="row" id="camRow" hidden>
        <label class="t">카메라</label>
        <div class="row chips" id="cams"></div>
      </div>
      <div class="row">
        <label class="t">필터</label>
        <div class="row chips" id="filters"></div>
      </div>
      <div class="row">
        <label class="t">마스코트</label>
        <div class="row" id="mascots"></div>
      </div>
      <div id="fields"></div>
      <div class="row">
        <button class="btn" id="flipBtn" type="button">🔄 카메라 전환</button>
        <button class="btn primary" id="shootBtn" type="button" disabled>🎬 촬영 시작</button>
      </div>
      <p class="hint">3초 카운트다운 후 자동으로 4장을 찍고, 촬영 과정은 영상으로 함께 저장돼요.</p>
    </div>
  </section>

  <section class="result card" id="resultSec">
    <img id="stripImg" alt="완성된 네컷 사진">
    <video id="filmVid" controls playsinline hidden></video>
    <div class="qrbox">
      <div id="qrImg"></div>
      <p id="qrMsg">QR 만드는 중…</p>
      <p id="qrSub">내 휴대폰 카메라로 QR을 찍으면 사진과 영상을 바로 받을 수 있어요. 받을 때까지 이 화면을 켜 두세요.</p>
    </div>
    <div class="row">
      <button class="btn" id="savePhoto" type="button">🖼 사진 저장</button>
      <button class="btn" id="saveFilm" type="button">🎞 영상 저장</button>
    </div>
    <div class="row">
      <button class="btn" id="shareBtn" type="button">📤 공유하기</button>
      <button class="btn primary" id="retakeBtn" type="button">↩ 다음 사람</button>
    </div>
    <p class="hint" id="shareHint"></p>
  </section>

  <section class="result card" id="recvSec">
    <p id="recvMsg" style="text-align:center;font-weight:600">디벗에 연결하는 중…</p>
    <img id="recvImg" alt="받은 네컷 사진" hidden>
    <video id="recvVid" controls playsinline hidden></video>
    <div class="row">
      <button class="btn primary" id="recvSavePhoto" type="button" disabled>📲 사진 저장</button>
      <button class="btn" id="recvSaveFilm" type="button" disabled>🎞 영상 저장</button>
    </div>
    <p class="hint">저장 버튼을 누르면 공유 창이 떠요. 아이폰은 "이미지 저장"/"비디오 저장", 안드로이드는 갤러리나 파일에 저장하세요. 사진을 길게 눌러 저장해도 돼요.</p>
    <div class="row" id="recvRetryRow" hidden>
      <button class="btn" id="recvRetry" type="button">🔁 다시 연결</button>
    </div>
  </section>
  <footer class="appfoot"><div id="ftLine"></div><div>ⓒKIMJINHO</div></footer>
</main>

  // 테마: 혜원여중 교표 색(초록·빨강) 중심. bg=바탕, accent=포인트, band=위·아래 띠 색
  const FRAMES = [
    { name: '교색 초록', bg: '#ffffff', ink: '#12331f', sub: '#5d7566', line: 'rgba(17,128,63,.35)', accent: HW_GREEN, band: [HW_GREEN, HW_RED], sticker: HW_RED },
    { name: '교색 빨강', bg: '#fff3f3', ink: '#4a1218', sub: '#8d5a60', line: 'rgba(211,32,44,.35)', accent: HW_RED, band: [HW_RED, HW_GREEN], sticker: HW_GREEN },
    { name: '진초록', bg: '#0d5a2c', ink: '#ffffff', sub: '#b9dcc6', line: 'rgba(255,255,255,.35)', accent: '#ffffff', band: ['#ffffff', HW_RED], sticker: HW_RED },
    { name: '크림', bg: '#fbf6ea', ink: '#2b2a22', sub: '#7d7a66', line: 'rgba(43,42,34,.22)', accent: HW_GREEN, band: [HW_GREEN, HW_RED], sticker: HW_GREEN },
  ];
  let frame = FRAMES[0];

  // 행사에 맞게 바꿔 쓰는 문구 (기기에 기억해 둔다)
  const FIELDS = [
    { key: 'head', label: '위 제목', def: '혜원여자중학교', max: 24 },
    { key: 'headSub', label: '위 부제', def: '2026학년도 우리들의 한 컷', max: 30 },
    { key: 'title', label: '아래 제목', def: '우리의 소중한 하루', max: 24 },
    { key: 'desc', label: '아래 설명', def: '친구들과 함께한 오늘을 기억해요', max: 40 },
    { key: 'place', label: '학교/장소', def: '혜원여자중학교', max: 20 },
    { key: 'sticker', label: '스티커', def: '혜원 최고! 🏐', max: 16 },
  ];
  const STORE_KEY = 'fourcut.fields.hyewon.v1';
  const values = {};
  function loadValues() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch (e) { /* 저장소를 못 쓰는 경우 */ }
    FIELDS.forEach((f) => { values[f.key] = typeof saved[f.key] === 'string' ? saved[f.key] : f.def; });
  }
  function saveValues() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(values)); } catch (e) { /* 저장소를 못 쓰는 경우 */ }
  }

  const state = { facing: 'user', deviceId: '', filter: 'none', stream: null, shooting: false, count: 0, shotNo: 0, flashAt: 0, photos: [], strip: null, filmBlob: null, stripBlob: null };

  // ---------- filters ----------
  // 미리보기와 찍힌 사진에 모두 적용된다 (canvas filter 를 지원하는 브라우저에서)
  const FILTERS = [
    { name: '기본', css: 'none' },
    { name: '흑백', css: 'grayscale(1) contrast(1.05)' },
    { name: '따뜻하게', css: 'sepia(.35) saturate(1.2) brightness(1.05)' },
    { name: '시원하게', css: 'hue-rotate(-12deg) saturate(1.1) brightness(1.05)' },
    { name: '뽀샤시', css: 'brightness(1.12) contrast(.92) saturate(1.1)' },
    { name: '빈티지', css: 'sepia(.5) contrast(.9) brightness(1.05)' },
  ];

  // ---------- camera ----------
  async function startCamera() {
    stopCamera();
    $('camMsg').hidden = false;
    $('camMsg').textContent = '카메라를 켜는 중…';
    try {
      state.stream = await navigator.mediaDevices.getUserMedia({
        video: Object.assign({ width: { ideal: 1280 }, height: { ideal: 960 } },
          state.deviceId ? { deviceId: { exact: state.deviceId } } : { facingMode: state.facing }), audio: false,
      });
      await listCameras();
      video.srcObject = state.stream;
      await video.play();
      $('camMsg').hidden = true;
      $('shootBtn').disabled = false;
    } catch (e) {
      $('camMsg').hidden = false;
      $('camMsg').textContent = '카메라를 사용할 수 없어요. 브라우저에서 카메라 권한을 허용하고 https 주소로 접속했는지 확인해 주세요.';
      $('shootBtn').disabled = true;
    }
  }
  // 연결된 카메라(노트북 웹캠, USB 웹캠 등)를 찾아 칩으로 보여 준다. 권한을 받은 뒤에야 이름이 보인다.
  async function listCameras() {
    let devs = [];
    try { devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput'); } catch (e) { /* 목록을 못 읽는 경우 */ }
    const cur = state.stream && state.stream.getVideoTracks()[0];
    const curId = cur && cur.getSettings().deviceId;
    const box = $('cams'); box.innerHTML = '';
    $('camRow').hidden = devs.length < 2;
    devs.forEach((d, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = '📷 ' + (d.label ? d.label.replace(/\s*\([0-9a-f]{4}:[0-9a-f]{4}\)/i, '') : '카메라 ' + (i + 1));
      b.className = d.deviceId === curId ? 'on' : '';
      b.onclick = () => { state.deviceId = d.deviceId; startCamera(); };
      box.appendChild(b);
    });
  }
  function stopCamera() {
    if (state.stream) state.stream.getTracks().forEach((t) => t.stop());
    state.stream = null;
  }

  // 영상을 4:3 비율로 꽉 채워 그린다 (전면 카메라는 거울 모드)
  function drawVideo(c, w, h) {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) { c.fillStyle = '#000'; c.fillRect(0, 0, w, h); return; }
    const s = Math.max(w / vw, h / vh), dw = vw * s, dh = vh * s;
    c.save();
    const fcss = (FILTERS.find((f) => f.name === state.filter) || FILTERS[0]).css;
    if ('filter' in c) c.filter = fcss;
    if (state.facing === 'user') { c.translate(w, 0); c.scale(-1, 1); }
    c.drawImage(video, (w - dw) / 2, (h - dh) / 2, dw, dh);
    c.restore();
  }

  function render() {
    drawVideo(ctx, W, H);
    if (state.shooting) {
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 16;
      if (state.count > 0) { ctx.font = 'bold 280px sans-serif'; ctx.fillText(String(state.count), W / 2, H / 2); }
      ctx.font = 'bold 44px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(`${state.shotNo} / ${SHOTS}`, 28, 24);
      ctx.shadowBlur = 0;
      const f = 1 - (performance.now() - state.flashAt) / 350;
      if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${f})`; ctx.fillRect(0, 0, W, H); }
    }
    requestAnimationFrame(render);
  }

  // ---------- recording (메이킹 필름) ----------
  function pickMime() {
    const list = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    return list.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
  }
  function startRecording() {
    if (!window.MediaRecorder || !cam.captureStream) return null;
    const mime = pickMime();
    const chunks = [];
    const rec = new MediaRecorder(cam.captureStream(30), mime ? { mimeType: mime, videoBitsPerSecond: 3_500_000 } : undefined);
    rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    const done = new Promise((res) => { rec.onstop = () => res(new Blob(chunks, { type: rec.mimeType || mime || 'video/webm' })); });
    rec.start(250);
    return { rec, done };
  }

  // ---------- shooting ----------
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function shoot() {
    if (state.shooting) return;
    state.shooting = true; state.photos = [];
    $('shootBtn').disabled = true; $('flipBtn').disabled = true;
    resetThumbs();
    const recording = startRecording();

    for (let i = 1; i <= SHOTS; i++) {
      state.shotNo = i;
      for (let c = COUNT; c >= 1; c--) { state.count = c; await sleep(1000); }
      state.count = 0;
      const shot = document.createElement('canvas');
      shot.width = W; shot.height = H;
      drawVideo(shot.getContext('2d'), W, H);
      state.photos.push(shot);
      state.flashAt = performance.now();
      addThumb(shot, i - 1);
      await sleep(900);
    }
    state.shooting = false;
    await sleep(300);
    let film = null;
    if (recording) { recording.rec.stop(); film = await recording.done; }
    state.filmBlob = film;
    await buildStrip();
    showResult();
  }

  // ---------- compose ----------
  function resetThumbs() { $('thumbs').innerHTML = '<div></div><div></div><div></div><div></div>'; }
  function addThumb(canvas, idx) {
    const img = document.createElement('img');
    img.src = canvas.toDataURL('image/jpeg', 0.7);
    $('thumbs').children[idx].appendChild(img);
  }

  function roundRectPath(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  // 글자가 칸을 넘으면 크기를 줄여 맞춘다
  function fitFont(g, text, weight, size, maxW) {
    let s = size;
    for (; s > 16; s -= 2) { g.font = `${weight} ${s}px ${FONT}`; if (g.measureText(text).width <= maxW) break; }
    g.font = `${weight} ${s}px ${FONT}`;
    return g.measureText(text).width;
  }
  // 교표는 비율을 지켜 높이 기준으로 그린다
  function drawLogo(g, cx, cy, h) {
    if (!logo.complete || !logo.naturalWidth) return 0;
    const w = h * logo.naturalWidth / logo.naturalHeight;
    g.drawImage(logo, cx - w / 2, cy - h / 2, w, h);
    return w;
  }

  function composeStrip() {
    const t = values;
    const c = document.createElement('canvas');
    c.width = SW; c.height = SH;
    const g = c.getContext('2d');
    g.fillStyle = frame.bg; g.fillRect(0, 0, SW, SH);
    g.textBaseline = 'middle';
    // 위·아래 교색 띠
    [0, SH - 22].forEach((y) => {
      g.fillStyle = frame.band[0]; g.fillRect(0, y, SW * 0.7, 22);
      g.fillStyle = frame.band[1]; g.fillRect(SW * 0.7, y, SW * 0.3, 22);
    });

    // 위: 교표 + 제목, 부제
    if (t.head) {
      const icon = 84, gap = 24;
      g.textAlign = 'left'; g.fillStyle = frame.ink;
      const w = fitFont(g, t.head, '700', 64, SW - M * 2 - icon - gap);
      const x0 = (SW - (icon * 0.89 + gap + w)) / 2;
      const lw = drawLogo(g, x0 + icon * 0.445, 92, icon);
      g.fillStyle = frame.ink; g.textAlign = 'left'; g.textBaseline = 'middle';
      fitFont(g, t.head, '700', 64, SW - M * 2 - icon - gap);
      g.fillText(t.head, x0 + (lw || 0) + gap, 95);
    }
    if (t.headSub) {
      g.textAlign = 'center'; g.fillStyle = frame.sub;
      fitFont(g, t.headSub, '400', 30, SW - M * 2);
      g.fillText(t.headSub, SW / 2, 172);
    }

    // 사진 4컷 (2×2, 가운데를 세로 컷으로 잘라 넣는다)
    const ar = CW / CH;
    state.photos.forEach((p, i) => {
      const x = M + (i % 2) * (CW + GX), y = ROW_Y + Math.floor(i / 2) * ROW_STEP;
      const sw = p.height * ar, sx = (p.width - sw) / 2;
      g.save(); roundRectPath(g, x, y, CW, CH, 20); g.clip();
      g.drawImage(p, sx, 0, sw, p.height, x, y, CW, CH);
      g.restore();
      g.fillStyle = frame.sub; g.textAlign = 'left'; g.font = `600 17px ${FONT}`;
      if ('letterSpacing' in g) g.letterSpacing = '1px';
      g.fillText(CELL_LABELS[i], x + 2, y + CH + 22);
      if ('letterSpacing' in g) g.letterSpacing = '0px';
    });

    // 스티커 (둘째 컷 위에 비스듬히)
    if (t.sticker) {
      const cx = M + CW + GX + CW * 0.53, cy = ROW_Y + CH * 0.6;
      g.save(); g.translate(cx, cy); g.rotate(-8 * Math.PI / 180);
      g.textAlign = 'center';
      const tw = fitFont(g, t.sticker, '700', 32, CW - 70);
      g.fillStyle = frame.sticker; roundRectPath(g, -tw / 2 - 24, -30, tw + 48, 60, 30); g.fill();
      g.fillStyle = '#fff'; g.fillText(t.sticker, 0, 2);
      g.restore();
    }

    // 아래: 제목, 설명, 아이콘
    g.textAlign = 'left';
    if (t.title) { g.fillStyle = frame.ink; fitFont(g, t.title, '700', 56, SW - M * 2 - (mascot.img ? 140 : 0)); g.fillText(t.title, M, 1570); }
    if (t.desc) { g.fillStyle = frame.sub; fitFont(g, t.desc, '400', 26, SW - M * 2 - (mascot.img ? 140 : 0)); g.fillText(t.desc, M, 1621); }

    // 맨 아래: 구분선, 학교/장소, 날짜
    g.strokeStyle = frame.line; g.lineWidth = 2;
    g.beginPath(); g.moveTo(M, 1678); g.lineTo(SW - M, 1678); g.stroke();
    if (t.place) { g.fillStyle = frame.ink; g.textAlign = 'left'; fitFont(g, t.place, '700', 28, SW / 2); g.fillText(t.place, M, 1716); }
    const d = new Date();
    g.fillStyle = frame.sub; g.textAlign = 'right'; g.font = `400 26px ${FONT}`;
    g.fillText(`${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`, SW - M, 1716);
    drawLogo(g, SW / 2, 1716, 44);
    if (mascot.img && mascot.img.complete) {
      const x = SW - M - 110, y = 1530, sz = 110;
      g.save(); roundRectPath(g, x, y, sz, sz, 24); g.clip();
      g.drawImage(mascot.img, x, y, sz, sz); g.restore();
      g.strokeStyle = frame.line; g.lineWidth = 3; roundRectPath(g, x, y, sz, sz, 24); g.stroke();
    }
    return c;
  }
  async function buildStrip() {
    state.strip = composeStrip();
    state.stripBlob = await new Promise((r) => state.strip.toBlob(r, 'image/png'));
  }

  // ---------- result ----------
  let urls = [];
  function showResult() {
    urls.forEach(URL.revokeObjectURL); urls = [];
    const imgUrl = URL.createObjectURL(state.stripBlob); urls.push(imgUrl);
    $('stripImg').src = imgUrl;
    const v = $('filmVid');
    if (state.filmBlob) {
      const u = URL.createObjectURL(state.filmBlob); urls.push(u);
      v.src = u; v.hidden = false;
    } else { v.hidden = true; }
    $('saveFilm').disabled = !state.filmBlob;
    $('shareHint').textContent = (navigator.canShare ? '' : '이 브라우저는 바로 공유를 지원하지 않아요. 저장한 뒤 직접 보내 주세요.');
    $('boothSec').hidden = true;
    $('resultSec').classList.add('on');
    stopCamera();
    startHost();
  }

  // ---------- QR 전송: 디벗(보내는 쪽) ----------
  // 서버에 사진을 올리지 않고 WebRTC로 디벗 → 휴대폰으로 직접 보낸다. (PeerJS 서버는 연결 중개만 한다.)
  const peerOpts = () => window.__peerOpts || {};
  let host = { peer: null, sent: 0 };
  function stopHost() {
    if (host.peer) host.peer.destroy();
    host = { peer: null, sent: 0 };
  }
  function qrFail(msg) {
    $('qrImg').innerHTML = '';
    $('qrMsg').textContent = msg;
    $('qrSub').textContent = '사진 저장·공유 버튼은 그대로 쓸 수 있어요.';
  }
  async function packFiles() {
    const out = [{ kind: 'photo', name: 'four-cut.png', mime: 'image/png', buf: await state.stripBlob.arrayBuffer() }];
    if (state.filmBlob) {
      out.push({ kind: 'film', name: `making-film.${ext(state.filmBlob)}`, mime: state.filmBlob.type.split(';')[0], buf: await state.filmBlob.arrayBuffer() });
    }
    return out;
  }
  function startHost() {
    stopHost();
    $('qrImg').innerHTML = '';
    $('qrMsg').textContent = 'QR 만드는 중…';
    $('qrSub').textContent = '내 휴대폰 카메라로 QR을 찍으면 사진과 영상을 바로 받을 수 있어요. 받을 때까지 이 화면을 켜 두세요.';
    if (!window.Peer || !window.qrcode) { qrFail('QR 기능을 불러오지 못했어요.'); return; }
    const id = 'fourcut-' + Math.random().toString(36).slice(2, 10);
    const peer = new Peer(id, peerOpts());
    host.peer = peer;
    const payload = packFiles();
    peer.on('open', () => {
      const url = `${location.origin === 'null' ? 'file://' : location.origin}${location.pathname}?r=${id}`;
      const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
      $('qrImg').innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      $('qrMsg').textContent = '📱 QR을 찍어서 받아 가세요';
      window.__booth.recvUrl = url;
    });
    peer.on('connection', (conn) => {
      conn.on('open', async () => {
        try {
          for (const f of await payload) conn.send(f);
          host.sent++;
          $('qrMsg').textContent = `✅ ${host.sent}명이 받아 갔어요 (더 찍어도 돼요)`;
        } catch (e) { /* 연결이 끊긴 경우 */ }
      });
    });
    peer.on('error', () => qrFail('QR을 만들 수 없어요. 인터넷 연결을 확인해 주세요.'));
  }

  // ---------- QR 전송: 휴대폰(받는 쪽) ----------
  function startReceiver(id) {
    document.title = '네컷 받기';
    $('boothSec').hidden = true;
    $('resultSec').classList.remove('on');
    $('recvSec').classList.add('on');
    const got = {};
    let peer, timer, done = false;
    const urls = [];

    const fileOf = (k) => new File([got[k].buf], got[k].name, { type: got[k].mime });
    const saveOrShare = async (k) => {
      const f = fileOf(k);
      try {
        if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; }
      } catch (e) { if (e && e.name === 'AbortError') return; }
      download(f, f.name);
    };
    const show = (k) => {
      const u = URL.createObjectURL(fileOf(k)); urls.push(u);
      if (k === 'photo') { $('recvImg').src = u; $('recvImg').hidden = false; $('recvSavePhoto').disabled = false; }
      else { $('recvVid').src = u; $('recvVid').hidden = false; $('recvSaveFilm').disabled = false; }
    };

    function connect() {
      $('recvRetryRow').hidden = true;
      $('recvMsg').textContent = '디벗에 연결하는 중…';
      if (peer) peer.destroy();
      peer = new Peer(peerOpts());
      const fail = () => {
        if (done) return;
        $('recvMsg').textContent = '연결하지 못했어요. 디벗 화면이 켜져 있는지 확인하고 다시 눌러 주세요.';
        $('recvRetryRow').hidden = false;
      };
      timer = setTimeout(fail, 20000);
      peer.on('error', () => { clearTimeout(timer); fail(); });
      peer.on('open', () => {
        const conn = peer.connect(id, { reliable: true, serialization: 'binary' });
        conn.on('data', (d) => {
          if (!d || !d.kind || got[d.kind]) return;
          got[d.kind] = d; show(d.kind);
          clearTimeout(timer);
          $('recvMsg').textContent = got.photo && got.film ? '🎉 다 받았어요! 저장 버튼을 눌러 주세요.' : '받는 중…';
          if (got.photo) done = true;
        });
        conn.on('error', () => { clearTimeout(timer); fail(); });
      });
    }
    $('recvRetry').onclick = connect;
    $('recvSavePhoto').onclick = () => saveOrShare('photo');
    $('recvSaveFilm').onclick = () => saveOrShare('film');
    connect();
  }
  function ext(blob) { return blob.type.includes('mp4') ? 'mp4' : 'webm'; }
  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  function files() {
    const f = [new File([state.stripBlob], 'four-cut.png', { type: 'image/png' })];
    if (state.filmBlob) f.push(new File([state.filmBlob], `making-film.${ext(state.filmBlob)}`, { type: state.filmBlob.type.split(';')[0] }));
    return f;
  }
  async function share() {
    const data = { title: '혜원여중 네컷', text: '혜원여중 네컷 📸' };
    let all = files();
    if (!(navigator.canShare && navigator.canShare({ ...data, files: all }))) all = all.slice(0, 1);
    try {
      if (navigator.canShare && navigator.canShare({ ...data, files: all })) await navigator.share({ ...data, files: all });
      else { $('shareHint').textContent = '이 브라우저는 바로 공유를 지원하지 않아요. 저장한 뒤 직접 보내 주세요.'; }
    } catch (e) { /* 사용자가 공유를 취소한 경우 */ }
  }

  // ---------- UI ----------
  FRAMES.forEach((f, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'swatch'; b.title = f.name; b.setAttribute('aria-label', f.name);
    b.style.background = f.bg; b.setAttribute('aria-pressed', i === 0);
    b.onclick = () => {
      frame = f;
      [...$('swatches').children].forEach((x) => x.setAttribute('aria-pressed', x === b));
    };
    $('swatches').appendChild(b);
  });

  FILTERS.forEach((f) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = f.name; b.className = f.name === state.filter ? 'on' : '';
    b.onclick = () => { state.filter = f.name; [...$('filters').children].forEach((x) => x.classList.toggle('on', x === b)); };
    $('filters').appendChild(b);
  });
  // 웹캠을 꽂거나 뽑으면 목록을 새로 만든다
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) navigator.mediaDevices.addEventListener('devicechange', () => { if (state.stream) listCameras(); });

  MASCOTS.forEach((m) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = m.emoji + ' ' + m.name; b.className = m === mascot ? 'on' : '';
    b.onclick = () => { mascot = m; [...$('mascots').children].forEach((x) => x.classList.toggle('on', x === b)); };
    $('mascots').appendChild(b);
  });

  loadValues();
  FIELDS.forEach((f) => {
    const row = document.createElement('div'); row.className = 'row';
    const lab = document.createElement('label'); lab.className = 't'; lab.textContent = f.label; lab.htmlFor = 'f_' + f.key;
    const inp = document.createElement('input');
    inp.type = 'text'; inp.id = 'f_' + f.key; inp.maxLength = f.max; inp.value = values[f.key];
    inp.oninput = () => { values[f.key] = inp.value.trim(); saveValues(); };
    row.append(lab, inp); $('fields').appendChild(row);
  });
  // 사진 속 크롭 가이드: 결과 컷(세로)에 들어가는 영역을 미리보기에 표시
  $('guide').style.width = ((CW / CH) / (W / H) * 100) + '%';

  $('shootBtn').onclick = shoot;
  $('flipBtn').onclick = () => { state.deviceId = ''; state.facing = state.facing === 'user' ? 'environment' : 'user'; startCamera(); };
  $('savePhoto').onclick = () => download(state.stripBlob, 'four-cut.png');
  $('saveFilm').onclick = () => state.filmBlob && download(state.filmBlob, `making-film.${ext(state.filmBlob)}`);
  $('shareBtn').onclick = share;
  $('retakeBtn').onclick = () => {
    stopHost();
    $('resultSec').classList.remove('on'); $('boothSec').hidden = false;
    resetThumbs(); $('flipBtn').disabled = false; startCamera();
  };

  window.__booth = { state };  // 테스트용
  const recvId = new URLSearchParams(location.search).get('r');
  if (recvId) {
    startReceiver(recvId);
  } else {
    render();
    startCamera();
  }
})();
</script>
</body>
</html>
